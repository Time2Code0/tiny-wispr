[workspace]
resolver = "3"
members = [
  "src-tauri",
  "crates/tw-core",
  "crates/tw-audio",
  "crates/tw-stt",
  "crates/tw-models",
  "crates/tw-llm",
  "crates/tw-llm-worker",
  "crates/tw-os",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

tw-core = { path = "crates/tw-core" }
tw-audio = { path = "crates/tw-audio" }
tw-stt = { path = "crates/tw-stt" }
tw-models = { path = "crates/tw-models" }
tw-llm = { path = "crates/tw-llm" }
tw-os = { path = "crates/tw-os" }

[profile.dev]
debug = "line-tables-only"

# whisper.cpp and llama.cpp are unusably slow unoptimised, even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
