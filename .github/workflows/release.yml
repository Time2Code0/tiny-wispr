name: Release

# Pushing a `v*` tag (made by `pnpm release <version>`) builds, signs and
# publishes a GitHub release with everything the in-app updater reads.
# See docs/operations/building-and-releasing.md.
#
# - `vX.Y.Z` must be on main and becomes the latest release, which installed
#   apps are offered.
# - `vX.Y.Z-rc.N` (any suffix) may come from any branch and is published as
#   a prerelease. The updater never offers one on its own.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Check the version
        run: node scripts/release-ci.mjs check-version --tag "$GITHUB_REF_NAME"

      - id: meta
        name: Read the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stable releases come from main
        if: steps.meta.outputs.prerelease == 'false'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag a prerelease like v1.2.3-rc.1 to release from a branch."
            exit 1
          fi

      - name: Check the signing secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name secret is missing"
              missing=1
            fi
          done
          exit "$missing"

  verify:
    name: Verify
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Apple Silicon
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      APP: target/release/bundle/macos/Tiny Wispr.app
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same self-signed certificate signs every release, so macOS keeps
      # the permission grants across updates.
      - name: Import the release certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"

      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: Tiny Wispr
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm tauri build --bundles app,dmg
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Check the code signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          for binary in tiny-wispr tw-llm-worker; do
            authority="$(codesign -dv --verbose=4 "$APP/Contents/MacOS/$binary" 2>&1 | grep '^Authority=' || true)"
            echo "$binary: $authority"
            if [[ "$authority" != "Authority=Tiny Wispr" ]]; then
              echo "::error::$binary isn't signed with the release certificate"
              exit 1
            fi
          done

      # The updater rejects a signature that doesn't name the version it was
      # made for (`requireSignedVersion`), or that the public key in
      # tauri.conf.json can't verify. Catch both here, not on users' Macs.
      - name: Check the update signature
        run: |
          signature="$APP.tar.gz.sig"
          comment="$(base64 --decode < "$signature" | sed -n 3p)"
          echo "$comment"
          if [[ "$comment" != *"version:$VERSION"* ]]; then
            echo "::error::The update signature doesn't name version $VERSION"
            exit 1
          fi
          brew install --quiet minisign
          public_key="$(node -p 'require("./src-tauri/tauri.conf.json").plugins.updater.pubkey' | base64 --decode | sed -n 2p)"
          base64 --decode < "$signature" > "$RUNNER_TEMP/update.minisig"
          minisign -V -q -P "$public_key" -m "$APP.tar.gz" -x "$RUNNER_TEMP/update.minisig"

      - name: Launch check
        run: |
          "$APP/Contents/MacOS/tiny-wispr" &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2> /dev/null; then
            echo "::error::Tiny Wispr quit within 20 seconds of starting"
            exit 1
          fi
          kill "$pid"

      - name: Collect release files
        run: |
          mkdir release-assets
          cp target/release/bundle/dmg/*.dmg "release-assets/Tiny-Wispr_${VERSION}_aarch64.dmg"
          cp "$APP.tar.gz" "release-assets/Tiny-Wispr_${VERSION}_aarch64.app.tar.gz"
          cp "$APP.tar.gz.sig" "release-assets/Tiny-Wispr_${VERSION}_aarch64.app.tar.gz.sig"
          ls -la release-assets

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [preflight, verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Write release notes
        run: |
          node scripts/release-ci.mjs notes --tag "$TAG" > notes.md
          {
            cat notes.md
            echo
            echo "### Install"
            echo
            echo "Download \`Tiny-Wispr_${VERSION}_aarch64.dmg\` (Apple Silicon, macOS 13 or later) and drag Tiny Wispr to Applications."
            echo
            echo "Tiny Wispr isn't notarized by Apple, so the first time you open it macOS says it can't check it. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. Updates after that install from inside the app."
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write the update manifest
        run: |
          node scripts/release-ci.mjs manifest --tag "$TAG" --notes notes.md \
            --dir release-assets --repo "$GITHUB_REPOSITORY" > release-assets/latest.json
          cat release-assets/latest.json

      - name: Write checksums
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Drafts first, published once every file is attached, so an
      # installed app never sees a release without its archive.
      - name: Publish the release
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" --draft --verify-tag \
            --title "Tiny Wispr $VERSION" --notes-file body.md "${flags[@]}" \
            release-assets/*
          gh release edit "$TAG" --draft=false
