name: Release

# Pushing a `v*` tag (made by `pnpm release <version>`) builds, signs and
# publishes a GitHub release for macOS (Apple Silicon), Windows and Linux,
# with everything the in-app updater reads.
# See docs/operations/building-and-releasing.md.
#
# - `vX.Y.Z` must be on main and becomes the latest release, which installed
#   apps are offered.
# - `vX.Y.Z-rc.N` (any suffix) may come from any branch and is published as
#   a prerelease. The updater never offers one on its own.
# - Running it by hand, or a pull request that changes the build, builds
#   every platform and keeps the files as workflow artifacts. Nothing is
#   published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/build.rs"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Entitlements.plist"
      - "src-tauri/Info.plist"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - id: meta
        name: Read the release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/release-ci.mjs check-version --tag "$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/release-ci.mjs check-version
            version="$(node -p 'require("./package.json").version')"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stable releases come from main
        if: steps.meta.outputs.publish == 'true' && steps.meta.outputs.prerelease == 'false'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag a prerelease like v1.2.3-rc.1 to release from a branch."
            exit 1
          fi

      - name: Check the signing secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name secret is missing"
              missing=1
            fi
          done
          exit "$missing"

  verify:
    name: Verify
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos
            runner: macos-15
            bundles: app,dmg
          - name: Windows (x64)
            platform: windows
            runner: windows-latest
            bundles: nsis
          - name: Linux (x64)
            platform: linux
            runner: ubuntu-22.04
            bundles: appimage,deb
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        uses: ./.github/actions/linux-deps

      - name: Setup Windows build tools
        if: matrix.platform == 'windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same self-signed certificate signs every macOS release, so macOS
      # keeps the permission grants across updates.
      - name: Import the release certificate
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=Tiny Wispr" >> "$GITHUB_ENV"

      - name: Build
        run: >-
          pnpm tauri build --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Check the code signature
        if: matrix.platform == 'macos'
        run: |
          app="target/release/bundle/macos/Tiny Wispr.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for binary in tiny-wispr tw-llm-worker; do
            authority="$(codesign -dv --verbose=4 "$app/Contents/MacOS/$binary" 2>&1 | grep '^Authority=' || true)"
            echo "$binary: $authority"
            if [[ "$authority" != "Authority=Tiny Wispr" ]]; then
              echo "::error::$binary isn't signed with the release certificate"
              exit 1
            fi
          done

      - name: Collect release files
        run: |
          out=release-assets
          mkdir "$out"
          bundle=target/release/bundle
          name="Tiny-Wispr_${VERSION}"
          # `copy <glob> <name>` copies the one file the glob matches, and its
          # updater signature when there is one.
          copy() {
            local matches=($1)
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}" ]]; then
              echo "::error::Expected one file for $1, found: ${matches[*]}"
              exit 1
            fi
            cp "${matches[0]}" "$out/$2"
            if [[ -f "${matches[0]}.sig" ]]; then
              cp "${matches[0]}.sig" "$out/$2.sig"
            fi
          }
          case "${{ matrix.platform }}" in
            macos)
              copy "$bundle/dmg/*.dmg" "${name}_aarch64.dmg"
              copy "$bundle/macos/*.app.tar.gz" "${name}_aarch64.app.tar.gz"
              ;;
            windows)
              copy "$bundle/nsis/*-setup.exe" "${name}_x64-setup.exe"
              ;;
            linux)
              copy "$bundle/appimage/*.AppImage" "${name}_amd64.AppImage"
              copy "$bundle/deb/*.deb" "${name}_amd64.deb"
              ;;
          esac
          ls -la "$out"

      # The bundler signs the AppImage but not every version of it signs the
      # .deb, which the updater installs for people who installed the .deb.
      - name: Sign the Linux package for the updater
        if: matrix.platform == 'linux'
        run: |
          deb="release-assets/Tiny-Wispr_${VERSION}_amd64.deb"
          if [[ ! -f "$deb.sig" ]]; then
            pnpm tauri signer sign --app-version "$VERSION" "$deb" > /dev/null
          fi

      - name: Launch check
        run: |
          case "${{ matrix.platform }}" in
            macos) binary="target/release/bundle/macos/Tiny Wispr.app/Contents/MacOS/tiny-wispr" ;;
            windows) binary="target/release/tiny-wispr.exe" ;;
            linux) binary="release-assets/Tiny-Wispr_${VERSION}_amd64.AppImage"; chmod +x "$binary" ;;
          esac
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run --auto-servernum "$binary" &
          else
            "$binary" &
          fi
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2> /dev/null; then
            wait "$pid"
            echo "::error::Tiny Wispr quit within 20 seconds of starting (exit code $?)"
            exit 1
          fi
          kill "$pid" || true

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [preflight, verify, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      # The updater rejects a signature that doesn't name the version it was
      # made for (`requireSignedVersion`), or that the public key in
      # tauri.conf.json can't verify. Catch both here, not on users' machines.
      - name: Check the update signatures
        run: |
          sudo apt-get install --yes --quiet minisign > /dev/null
          public_key="$(node -p 'require("./src-tauri/tauri.conf.json").plugins.updater.pubkey' | base64 --decode | sed -n 2p)"
          shopt -s nullglob
          signatures=(release-assets/*.sig)
          if [[ ${#signatures[@]} -ne 4 ]]; then
            echo "::error::Expected 4 update signatures (macOS, Windows, AppImage, deb), found ${#signatures[@]}"
            exit 1
          fi
          for signature in "${signatures[@]}"; do
            file="${signature%.sig}"
            comment="$(base64 --decode < "$signature" | sed -n 3p)"
            echo "$(basename "$file"): $comment"
            if [[ "$comment" != *"version:$VERSION"* ]]; then
              echo "::error::The signature of $(basename "$file") doesn't name version $VERSION"
              exit 1
            fi
            base64 --decode < "$signature" > "$RUNNER_TEMP/update.minisig"
            minisign -V -q -P "$public_key" -m "$file" -x "$RUNNER_TEMP/update.minisig"
          done

      - name: Write release notes
        run: |
          node scripts/release-ci.mjs notes --tag "$TAG" > notes.md
          {
            cat notes.md
            echo
            echo "### Install"
            echo
            echo "| System | Download |"
            echo "| --- | --- |"
            echo "| macOS 13 or later, Apple Silicon | \`Tiny-Wispr_${VERSION}_aarch64.dmg\` |"
            echo "| Windows 10 or 11, x64 | \`Tiny-Wispr_${VERSION}_x64-setup.exe\` |"
            echo "| Linux x64 (X11) | \`Tiny-Wispr_${VERSION}_amd64.AppImage\` or \`Tiny-Wispr_${VERSION}_amd64.deb\` |"
            echo
            echo "- **macOS:** open the DMG and drag Tiny Wispr to Applications. The app isn't notarized by Apple, so the first time you open it, go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**."
            echo "- **Windows:** run the installer. It isn't code-signed, so Windows SmartScreen may warn: click **More info**, then **Run anyway**."
            echo "- **Linux:** make the AppImage executable (\`chmod +x\`) and run it, or install the package with \`sudo apt install ./Tiny-Wispr_${VERSION}_amd64.deb\`. Global shortcuts and paste need an X11 session; they don't work under Wayland."
            echo
            echo "After the first install, updates install from inside the app (Settings → About)."
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write the update manifest
        run: |
          node scripts/release-ci.mjs manifest --tag "$TAG" --notes notes.md \
            --dir release-assets --repo "$GITHUB_REPOSITORY" > release-assets/latest.json
          cat release-assets/latest.json

      - name: Write checksums
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Drafts first, published once every file is attached, so an
      # installed app never sees a release without its update.
      - name: Publish the release
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" --draft --verify-tag \
            --title "Tiny Wispr $VERSION" --notes-file body.md "${flags[@]}" \
            release-assets/*
          gh release edit "$TAG" --draft=false
